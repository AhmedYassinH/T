apiVersion: v1
kind: Secret
metadata: {name: document-demo-auth}
type: Opaque
stringData: {admin: kappa11-demo-admin, app: kappa11-demo-app}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: portal-settings}
data: {database: workspaces}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: document-db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: document-db}
  template:
    metadata:
      labels: {app: document-db}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mongo
          image: mongo:8.0.30-noble
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, value: lab_admin}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: document-demo-auth, key: admin}
          ports:
            - {name: mongo, containerPort: 27017}
          readinessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data/db}
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: document-db}
spec:
  selector: {app: document-db}
  ports:
    - {name: mongo, port: 27017, targetPort: mongo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: workspace-portal}
spec:
  replicas: 1
  selector:
    matchLabels: {app: workspace-portal}
  template:
    metadata:
      labels: {app: workspace-portal}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: portal
          image: mongo:8.0.30-noble
          command: [sleep, "86400"]
          env:
            - name: APP_DB
              valueFrom:
                configMapKeyRef: {name: portal-settings, key: database}
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: {name: document-demo-auth, key: app}
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 250m, memory: 160Mi}
