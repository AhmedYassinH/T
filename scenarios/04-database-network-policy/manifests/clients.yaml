apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Pod
    metadata:
      name: report-app
      labels: {app: report-app, role: report-reader}
    spec: &client_spec
      automountServiceAccountToken: false
      containers:
        - name: client
          image: postgres:17.11-alpine3.23
          command: [sleep, "86400"]
          env:
            - {name: PGHOST, value: report-db}
            - {name: PGPORT, value: "5432"}
            - {name: PGDATABASE, value: reporting}
            - {name: PGUSER, value: report_reader}
            - {name: PGCONNECT_TIMEOUT, value: "3"}
            - {name: PGSSLMODE, value: disable}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: report-credentials, key: reader-password}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: code, mountPath: /demo, readOnly: true}
      volumes:
        - name: code
          configMap: {name: report-demo, items: [{key: report.sh, path: report.sh}]}
  - apiVersion: v1
    kind: Pod
    metadata:
      name: test-client
      labels: {app: test-client, role: unrelated}
    spec: *client_spec
