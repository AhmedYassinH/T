apiVersion: v1
kind: Secret
metadata:
  name: report-credentials
type: Opaque
stringData:
  admin-password: demo04-admin-only
  reader-password: demo04-reader-only
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-demo
data:
  seed.sql: |
    CREATE TABLE well_reading (id integer PRIMARY KEY, pressure_bar numeric(5,1) NOT NULL);
    INSERT INTO well_reading VALUES (1, 210.5);
    CREATE ROLE report_reader LOGIN PASSWORD 'demo04-reader-only';
    GRANT SELECT ON well_reading TO report_reader;
  report.sh: |
    #!/bin/sh
    set -eu
    psql -X -w -A -t -v ON_ERROR_STOP=1 -c 'SELECT pressure_bar FROM well_reading WHERE id = 1;'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-db
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: report-db}
  template:
    metadata:
      labels: {app: report-db}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.11-alpine3.23
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: reporting}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: report-credentials, key: admin-password}
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, reporting]
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: code, mountPath: /docker-entrypoint-initdb.d/seed.sql, subPath: seed.sql, readOnly: true}
      volumes:
        - {name: data, emptyDir: {}}
        - name: code
          configMap: {name: report-demo}
---
apiVersion: v1
kind: Service
metadata:
  name: report-db
spec:
  type: ClusterIP
  selector: {app: report-db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres, protocol: TCP}
