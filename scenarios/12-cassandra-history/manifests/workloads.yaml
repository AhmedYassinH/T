apiVersion: v1
kind: ConfigMap
metadata: {name: history-settings}
data: {keyspace: measurements}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: history-db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: history-db}
  template:
    metadata:
      labels: {app: history-db}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cassandra
          image: cassandra:5.0.9
          env:
            - {name: MAX_HEAP_SIZE, value: 512M}
            - {name: HEAP_NEWSIZE, value: 128M}
            - {name: CASSANDRA_CLUSTER_NAME, value: kappa-history-lab}
            - {name: CASSANDRA_NUM_TOKENS, value: "16"}
          ports:
            - {name: cql, containerPort: 9042}
          readinessProbe:
            tcpSocket: {port: cql}
            periodSeconds: 5
          resources:
            requests: {cpu: 150m, memory: 768Mi}
            limits: {cpu: "1", memory: 1280Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/cassandra}
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: history-db}
spec:
  selector: {app: history-db}
  ports:
    - {name: cql, port: 9042, targetPort: cql}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: history-client}
spec:
  replicas: 1
  selector:
    matchLabels: {app: history-client}
  template:
    metadata:
      labels: {app: history-client}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: client
          image: cassandra:5.0.9
          command: [sleep, "86400"]
          env:
            - name: APP_KEYSPACE
              valueFrom:
                configMapKeyRef: {name: history-settings, key: keyspace}
          resources:
            requests: {cpu: 10m, memory: 40Mi}
            limits: {cpu: 250m, memory: 160Mi}
