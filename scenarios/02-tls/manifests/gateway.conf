worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events { worker_connections 128; }

http {
    log_format lab 'status=$status upstream=$upstream_addr upstream_status=$upstream_status '
                   'request="$request" nonce=$http_x_lab_nonce';
    access_log /dev/stdout lab;
    server_tokens off;

    server {
        listen 8080;
        location = /healthz { return 200 'gateway-ready\n'; }
    }

    server {
        listen 8443 ssl;
        server_name portal.lab.test;
        ssl_certificate /etc/lab-tls/tls.crt;
        ssl_certificate_key /etc/lab-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Lab-Gateway tls-gateway always;

        location / {
            proxy_pass https://tls-api:443;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/upstream-trust/ca.crt;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name api.lab.test;
            proxy_connect_timeout 3s;
            proxy_read_timeout 7s;
            proxy_set_header Host api.lab.test;
            proxy_set_header X-Lab-Nonce $http_x_lab_nonce;
        }
    }
}
