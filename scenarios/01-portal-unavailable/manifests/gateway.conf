worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events { worker_connections 128; }

http {
    log_format lab '$remote_addr "$request" status=$status upstream=$upstream_addr '
                   'upstream_status=$upstream_status nonce=$http_x_lab_nonce';
    access_log /dev/stdout lab;
    server_tokens off;

    server {
        listen 8080;
        add_header X-Lab-Gateway portal-gateway always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"gateway-ready"}';
        }

        location / {
            proxy_pass http://portal-api:80;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Lab-Nonce $http_x_lab_nonce;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
