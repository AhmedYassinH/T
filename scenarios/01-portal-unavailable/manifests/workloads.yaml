# Healthy baseline. setup.sh creates the two ConfigMaps from source files first.
# All resources are namespaced by kubectl; this file has no cluster-wide objects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-api
  labels:
    app.kubernetes.io/part-of: kappa-practice-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal-api
  template:
    metadata:
      labels:
        app: portal-api
        app.kubernetes.io/part-of: kappa-practice-01
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: python:3.12.16-alpine3.24
          imagePullPolicy: IfNotPresent
          command: [python, -u, /app/app.py]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: portal-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: portal-api
spec:
  type: ClusterIP
  selector:
    app: portal-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-gateway
  labels:
    app.kubernetes.io/part-of: kappa-practice-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-gateway
  template:
    metadata:
      labels:
        app: portal-gateway
        app.kubernetes.io/part-of: kappa-practice-01
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.30.6-alpine3.24
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: portal-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: portal-gateway
spec:
  type: ClusterIP
  selector:
    app: portal-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: lab-client
  labels:
    app: lab-client
    app.kubernetes.io/part-of: kappa-practice-01
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: python:3.12.16-alpine3.24
      imagePullPolicy: IfNotPresent
      command: [python, -c, "import time; time.sleep(2147483647)"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
