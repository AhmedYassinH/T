apiVersion: v1
kind: ConfigMap
metadata: {name: report-worker-settings}
data: {queue: daily-reports}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: report-orchestrator}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: report-orchestrator}
  template:
    metadata:
      labels: {app: report-orchestrator}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: temporal
          image: temporalio/temporal:1.10.1
          command: [temporal, server, start-dev]
          args: [--ip, "0.0.0.0", --headless, --db-filename, /tmp/report.sqlite]
          ports:
            - {name: frontend, containerPort: 7233}
          readinessProbe:
            tcpSocket: {port: frontend}
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata: {name: report-orchestrator}
spec:
  selector: {app: report-orchestrator}
  ports:
    - {name: frontend, port: 7233, targetPort: frontend}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: temporal-report-worker}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: temporal-report-worker}
  template:
    metadata:
      labels: {app: temporal-report-worker}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: install-sdk
          image: python:3.12.16-slim-bookworm
          command: [pip, --disable-pip-version-check, --no-cache-dir, install, --only-binary=:all:, --retries, "1", --target, /deps, "temporalio==1.35.0"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
          volumeMounts:
            - {name: deps, mountPath: /deps}
      containers:
        - name: worker
          image: python:3.12.16-slim-bookworm
          command: [python, -u, /app/report_flow.py, worker]
          env:
            - {name: PYTHONPATH, value: /deps}
            - name: REPORT_QUEUE
              valueFrom:
                configMapKeyRef: {name: report-worker-settings, key: queue}
          readinessProbe:
            exec: {command: [test, -f, /tmp/worker-ready]}
            periodSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 160Mi}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: deps, mountPath: /deps, readOnly: true}
      volumes:
        - {name: deps, emptyDir: {}}
        - name: code
          configMap: {name: temporal-demo-code}
