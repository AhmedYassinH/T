apiVersion: v1
kind: Secret
metadata: {name: report-db-admin}
type: Opaque
stringData: {password: kappa09-demo-admin}
---
apiVersion: v1
kind: Secret
metadata: {name: readings-app-auth}
type: Opaque
stringData: {password: kappa09-demo-before}
---
apiVersion: v1
kind: Secret
metadata: {name: approved-readings-auth}
type: Opaque
stringData: {password: kappa09-demo-current}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: readings-db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: readings-db}
  template:
    metadata:
      labels: {app: readings-db}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.11-alpine3.23
          env:
            - {name: POSTGRES_DB, value: readings}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: report-db-admin, key: password}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -d, readings, -U, postgres]
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: readings-db}
spec:
  selector: {app: readings-db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: readings-app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: readings-app}
  template:
    metadata:
      labels: {app: readings-app}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: report
          image: postgres:17.11-alpine3.23
          command: [sleep, "86400"]
          env:
            - {name: PGHOST, value: readings-db}
            - {name: PGPORT, value: "5432"}
            - {name: PGDATABASE, value: readings}
            - {name: PGUSER, value: readings_app}
            - {name: PGCONNECT_TIMEOUT, value: "3"}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: readings-app-auth, key: password}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
