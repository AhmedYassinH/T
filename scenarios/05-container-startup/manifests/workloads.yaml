apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-settings
data:
  station-id: well-17
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reading-collector
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: reading-collector}
  template:
    metadata:
      labels: {app: reading-collector}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          image: python:3.12.16-alpine3.24
          imagePullPolicy: IfNotPresent
          command: [python, -u, /app/collector.py]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: STATION_ID
              valueFrom:
                configMapKeyRef: {name: collector-settings, key: station-id}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 24Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap: {name: collector-code}
---
apiVersion: v1
kind: Service
metadata:
  name: reading-collector
spec:
  type: ClusterIP
  selector: {app: reading-collector}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: Pod
metadata:
  name: collector-client
  labels: {app: collector-client}
spec:
  automountServiceAccountToken: false
  containers:
    - name: client
      image: python:3.12.16-alpine3.24
      command: [sleep, "86400"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 48Mi}
