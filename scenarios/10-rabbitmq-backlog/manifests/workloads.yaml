apiVersion: v1
kind: Secret
metadata: {name: broker-demo-auth}
type: Opaque
stringData: {user: reports_demo, password: kappa10-demo-password}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: report-settings}
data: {work-queue: report-jobs}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: report-broker}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: report-broker}
  template:
    metadata:
      labels: {app: report-broker}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2.9-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: broker-demo-auth, key: user}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: broker-demo-auth, key: password}
          ports:
            - {name: amqp, containerPort: 5672}
          readinessProbe:
            tcpSocket: {port: amqp}
            periodSeconds: 2
          resources:
            requests: {cpu: 75m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: broker-data, mountPath: /var/lib/rabbitmq}
      volumes:
        - {name: broker-data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: report-broker}
spec:
  selector: {app: report-broker}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: report-worker}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: report-worker}
  template:
    metadata:
      labels: {app: report-worker}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: install-client
          image: python:3.12.16-alpine3.24
          command: [pip, --disable-pip-version-check, --no-cache-dir, install, --retries, "1", --target, /deps, "pika==1.3.2"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 96Mi}
          volumeMounts:
            - {name: deps, mountPath: /deps}
      containers:
        - name: worker
          image: python:3.12.16-alpine3.24
          command: [python, -u, /app/queue_demo.py, worker]
          env:
            - {name: PYTHONPATH, value: /deps}
            - name: WORK_QUEUE
              valueFrom:
                configMapKeyRef: {name: report-settings, key: work-queue}
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: {name: broker-demo-auth, key: user}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: {name: broker-demo-auth, key: password}
          readinessProbe:
            exec:
              command: [test, -f, /tmp/ready]
            periodSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 24Mi}
            limits: {cpu: 200m, memory: 96Mi}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: deps, mountPath: /deps, readOnly: true}
      volumes:
        - {name: deps, emptyDir: {}}
        - name: code
          configMap: {name: report-code}
